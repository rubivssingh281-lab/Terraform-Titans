# ==============================================================================
# Echolytix Test Automation Framework - Centralized Object Repository (DevOps)
# File: locator.properties
# 
# Purpose:
#   Decouples UI locators (XPaths, CSS, IDs) from test code & page objects.
#   Allows DevOps engineers & QA automation teams to update UI element selectors
#   in a single location without code recompilation or multi-file Git commits.
#
# Format:
#   <key>=<xpath>
#   Optional prefixes supported: xpath:, css:, id:, name:, class:, tag:
#   Dynamic tokens (%s) can be parameterized via LocatorReader.getBy(key, arg1, arg2...)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. AUTHENTICATION & LOGIN PAGE (LoginPage)
# ------------------------------------------------------------------------------
login.form                                  = //form[.//button[@type='submit']]
login.email.input                           = //form[.//button[@type='submit']]//input[@type='email']
login.password.input                        = //form[.//button[@type='submit']]//input[@type='password'] | //input[@type='password']
login.authorize.button                      = //button[@type='submit' and (contains(., 'AUTHORIZE') or contains(., 'VERIFYING'))]
login.autofill.button                       = //button[contains(., 'Auto-fill Testing Credentials')]
login.loading.spinner                       = //*[contains(text(), 'ESTABLISHING SECURE CONNECTION')]
login.dashboard.signout                     = //button[contains(., 'Sign Out')]
login.dashboard.signcard                    = //button[.//span[contains(text(), 'Sign Gestures')]]
login.simple.button                         = //button[text()='Login']
login.username.input                        = //input[@id='username']

# ------------------------------------------------------------------------------
# 2. PATIENT REGISTRATION MODAL
# ------------------------------------------------------------------------------
register.link                               = //button[contains(text(), 'Register Account')]
register.name.input                         = //input[@placeholder='Stephen Hawking']
register.email.input                        = //input[@placeholder='name@example.com']
register.password.input                     = //input[@placeholder='Min 8 chars, letter & number']
register.confirm.password.input             = //input[@placeholder='Re-type password']
register.submit.button                      = //button[contains(., 'REGISTER NEW PATIENT')]
register.error.password.mismatch            = //span[contains(text(), 'Passwords do not match.')]

# ------------------------------------------------------------------------------
# 3. GLOBAL NAVIGATION & APP HEADER
# ------------------------------------------------------------------------------
nav.sign.button                             = //nav//button[contains(., 'Sign') and not(contains(., 'Sign Out'))]
nav.header.sign.button                      = //header//button[normalize-space()='Sign']
nav.header.dashboard.button                 = //header//button[normalize-space()='Dashboard']
nav.button.by.label                         = //button[normalize-space()='%s']
element.contains.text                       = //*[contains(normalize-space(), '%s')]

# ------------------------------------------------------------------------------
# 4. DASHBOARD (DashboardPage)
# ------------------------------------------------------------------------------
dashboard.sign.card                         = //button[.//span[contains(text(), 'Sign Gestures')]]
dashboard.signout.button                    = //button[contains(., 'Sign Out')]
dashboard.patient.hub.badge                 = //div[contains(text(), 'PATIENT HUB ACTIVATED')]
dashboard.patient.profile.name              = //*[@id='patient-profile-name']
dashboard.tab.sign                          = //button[contains(., 'Sign') or contains(., 'sign')]

# ------------------------------------------------------------------------------
# 5. HAND SIGN GESTURE MODULE (HandSignGesturePage)
# ------------------------------------------------------------------------------
# Headings & Status
handsign.translation.heading                = //h2[contains(., 'Translation')]
handsign.gesture.engine.title               = //div[contains(text(), 'Geometric Gesture Engine')]
handsign.hand.detect.badge                  = //span[contains(text(), 'Hand Detected') or contains(text(), 'No Hand')]

# Output Containers
handsign.current.gesture.value              = //span[text()='CURRENT GESTURE']/following-sibling::div//div[contains(@class, 'text-2xl')]
handsign.constructed.phrase.container       = //span[text()='CONSTRUCTED PHRASE']/following-sibling::div/div[1]

# Telemetry & HUD
handsign.confidence.value                   = //span[text()='CONFIDENCE']/following-sibling::span
handsign.fps.value                          = //span[text()='FPS']/following-sibling::span

# Camera Controls
handsign.webcam.toggle.button               = //button[contains(., 'Use Real Webcam') or contains(., 'Close Camera')]
handsign.skeleton.checkbox                  = //label[contains(., 'Skeleton Overlay')]//input[@type='checkbox']

# Voice & Speech Controls
handsign.voice.select.dropdown              = //div[contains(., 'Voice Selection')]/select
handsign.speed.rate.slider                  = //span[text()='Speed Rate']/ancestor::div[1]/following-sibling::input[@type='range']
handsign.speed.rate.display                 = //span[text()='Speed Rate']/following-sibling::span
handsign.pitch.slider                       = //span[text()='Pitch']/ancestor::div[1]/following-sibling::input[@type='range']
handsign.pitch.display                      = //span[text()='Pitch']/following-sibling::span

# Action Buttons
handsign.delete.word.button                 = //button[contains(., 'Delete Word')]
handsign.clear.all.button                   = //button[contains(., 'Clear All')]
handsign.submit.button                      = //button[contains(., 'Submit')]
handsign.ai.complete.button                 = //button[contains(., 'AI Complete')]
handsign.speak.output.button                = //button[@title='Speak Output']

# Cheat Sheet & Signals (Dynamic / Parameterized)
handsign.cheat.sheet.header                 = //h3[contains(., 'Gesture Cheat Sheet')]
handsign.cheat.sheet.gesture.button         = //h3[contains(., 'Gesture Cheat Sheet')]/following-sibling::div//button[.//span[text()='%s'] or contains(., '%s')]
handsign.live.finger.signal                 = //span[text()='Live Finger Signal']/following-sibling::div//span[text()='%s']
